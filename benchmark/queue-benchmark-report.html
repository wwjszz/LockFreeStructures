  cursor: not-allowed;

  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;queue-current-report&#x27;);
  const tooltip = root.querySelector(&#x27;.tooltip&#x27;);
  const threads = [1, 2, 4, 8, 12, 16, 20, 24];
  const paths = [&#x27;Implicit&#x27;, &#x27;Tokens&#x27;, &#x27;TokenBulk&#x27;];
  const pathLabels = { Implicit: &#x27;无 token&#x27;, Tokens: &#x27;Producer + Consumer token&#x27;, TokenBulk: &#x27;Token bulk&#x27; };
  const colors = { Implicit: &#x27;var(--viz-series-1)&#x27;, Tokens: &#x27;var(--viz-series-2)&#x27;, TokenBulk: &#x27;var(--viz-series-3)&#x27; };
  const raw = {
    EqualBlocks: {
      Implicit: {
        Hakle: [46.135, 18.901, 17.067, 16.928, 17.490, 18.731, 20.844, 22.846],
        Moodycamel: [38.143, 16.291, 17.707, 17.570, 17.129, 17.999, 19.081, 20.631],
        hakleCv: [0.39, 0.81, 1.44, 2.40, 0.40, 0.42, 1.33, 0.41],
        moodyCv: [1.20, 3.21, 1.72, 2.56, 2.27, 2.91, 2.12, 1.79],
        oldHakle: [33.400, 17.821, 15.180, 14.776, 15.300, 16.221, 18.296, 19.695]
      },
      Tokens: {
        Hakle: [52.174, 39.449, 72.597, 104.160, 153.421, 165.178, 170.487, 258.990],
        Moodycamel: [46.912, 37.811, 64.841, 95.821, 127.047, 155.799, 161.136, 164.266],
        hakleCv: [0.62, 6.56, 5.42, 1.73, 2.25, 5.06, 2.78, 11.98],
        moodyCv: [0.49, 6.36, 5.20, 4.45, 3.44, 4.19, 2.61, 5.13],
        oldHakle: [45.850, 47.566, 68.982, 91.571, 111.943, 166.469, 156.194, 179.788]
      },
      TokenBulk: {
        Hakle: [396.952, 590.729, 936.561, 786.681, 885.260, 853.151, 934.908, 852.475],
        Moodycamel: [346.731, 527.530, 807.099, 802.043, 743.234, 878.903, 803.260, 734.312],
        hakleCv: [2.68, 1.58, 0.97, 6.62, 15.31, 9.96, 8.64, 12.57],
        moodyCv: [0.98, 1.22, 1.39, 11.63, 7.85, 12.10, 6.46, 10.90],
        oldHakle: [411.896, 610.580, 870.712, 805.741, 719.328, 820.294, 849.084, 798.845]
      }
    },
    ZeroInitialPool: {
      Implicit: {
        Hakle: [44.585, 18.578, 17.411, 17.061, 17.560, 18.789, 20.626, 22.591],
        Moodycamel: [38.253, 16.432, 17.351, 17.473, 17.176, 18.198, 18.942, 20.742],
        hakleCv: [0.58, 0.96, 0.46, 0.66, 0.60, 0.43, 0.88, 0.57],
        moodyCv: [0.82, 1.60, 2.80, 2.20, 1.22, 1.84, 2.28, 1.48],
        oldHakle: [33.033, 16.874, 14.801, 15.046, 15.261, 16.314, 17.684, 19.687]
      },
      Tokens: {
        Hakle: [50.594, 38.659, 74.219, 110.315, 112.342, 173.509, 230.139, 284.504],
        Moodycamel: [44.951, 36.585, 65.490, 103.133, 132.711, 164.865, 194.787, 246.631],
        hakleCv: [0.40, 9.14, 1.82, 2.02, 4.03, 1.83, 3.75, 1.78],
        moodyCv: [0.49, 5.40, 3.21, 1.43, 2.17, 1.46, 14.18, 7.76],
        oldHakle: [45.739, 44.393, 70.538, 99.491, 106.873, 167.380, 163.848, 239.980]
      },
      TokenBulk: {
        Hakle: [383.469, 600.621, 962.617, 882.474, 1031.394, 1023.307, 1006.748, 932.793],
        Moodycamel: [338.673, 543.007, 845.848, 907.403, 837.730, 921.667, 966.796, 838.471],
        hakleCv: [2.15, 1.04, 7.70, 11.28, 6.55, 12.07, 11.89, 9.75],
        moodyCv: [1.12, 1.09, 1.25, 7.18, 16.41, 13.25, 14.46, 8.95],
        oldHakle: [378.956, 600.065, 937.499, 761.008, 954.012, 1056.900, 1101.324, 910.066]
      }
    }
  };

  const descriptors = [];
  for (const path of paths) {
    descriptors.push({ key: `Hakle|${path}`, impl: &#x27;Hakle&#x27;, path, label: `Hakle · ${pathLabels[path]}`, color: colors[path], dash: null, symbol: d3.symbolCircle });
    descriptors.push({ key: `Moodycamel|${path}`, impl: &#x27;Moodycamel&#x27;, path, label: `moodycamel · ${pathLabels[path]}`, color: colors[path], dash: &#x27;6 4&#x27;, symbol: d3.symbolDiamond });
  }
  const active = new Set(descriptors.map(d =&gt; d.key));

  const legend = d3.select(root.querySelector(&#x27;.series-legend&#x27;));
  const legendButtons = legend.selectAll(&#x27;button&#x27;)
    .data(descriptors)
    .join(&#x27;button&#x27;)
    .attr(&#x27;type&#x27;, &#x27;button&#x27;)
    .attr(&#x27;class&#x27;, &#x27;legend-button&#x27;)
    .attr(&#x27;aria-pressed&#x27;, &#x27;true&#x27;)
    .attr(&#x27;aria-label&#x27;, d =&gt; `显示或隐藏 ${d.label}`)
    .on(&#x27;click&#x27;, function(event, d) {
      if (active.has(d.key)) active.delete(d.key); else active.add(d.key);
      d3.select(this).attr(&#x27;aria-pressed&#x27;, active.has(d.key) ? &#x27;true&#x27; : &#x27;false&#x27;);
      drawAll();
    });
  const swatches = legendButtons.append(&#x27;svg&#x27;).attr(&#x27;class&#x27;, &#x27;legend-swatch&#x27;).attr(&#x27;viewBox&#x27;, &#x27;0 0 24 10&#x27;).attr(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
  swatches.append(&#x27;line&#x27;)
    .attr(&#x27;x1&#x27;, 1).attr(&#x27;x2&#x27;, 23).attr(&#x27;y1&#x27;, 5).attr(&#x27;y2&#x27;, 5)
    .attr(&#x27;stroke&#x27;, d =&gt; d.color).attr(&#x27;stroke-width&#x27;, 2)
    .attr(&#x27;stroke-dasharray&#x27;, d =&gt; d.dash);
  swatches.append(&#x27;path&#x27;)
    .attr(&#x27;transform&#x27;, &#x27;translate(12,5)&#x27;)
    .attr(&#x27;d&#x27;, d =&gt; d3.symbol().type(d.symbol).size(28)())
    .attr(&#x27;fill&#x27;, d =&gt; d.impl === &#x27;Hakle&#x27; ? d.color : &#x27;var(--background)&#x27;)
    .attr(&#x27;stroke&#x27;, d =&gt; d.color);
  legendButtons.append(&#x27;span&#x27;).text(d =&gt; d.label);

  function seriesFor(mode, kind) {
    if (kind === &#x27;delta&#x27;) {
      return descriptors.filter(d =&gt; d.impl === &#x27;Hakle&#x27; &amp;&amp; active.has(d.key)).map(d =&gt; ({
        ...d,
        values: threads.map((x, i) =&gt; ({
          x,
          y: (raw[mode][d.path].Hakle[i] / raw[mode][d.path].oldHakle[i] - 1) * 100,
          current: raw[mode][d.path].Hakle[i],
          previous: raw[mode][d.path].oldHakle[i]
        }))
      }));
    }
    return descriptors.filter(d =&gt; active.has(d.key)).map(d =&gt; {
      const values = raw[mode][d.path][d.impl];
      const cvs = raw[mode][d.path][d.impl === &#x27;Hakle&#x27; ? &#x27;hakleCv&#x27; : &#x27;moodyCv&#x27;];
      return {
        ...d,
        values: threads.map((x, i) =&gt; ({ x, y: values[i], cv: cvs[i], lo: values[i] * (1 - cvs[i] / 100), hi: values[i] * (1 + cvs[i] / 100) }))
      };
    });
  }

  function interpolate(values, x) {
    const nearIndex = d3.bisector(d =&gt; d.x).center(values, x);
    if (x &lt;= values[0].x) return { ...values[0], nearIndex };
    if (x &gt;= values[values.length - 1].x) return { ...values[values.length - 1], nearIndex };
    const right = d3.bisector(d =&gt; d.x).left(values, x);
    const a = values[right - 1];
    const b = values[right];
    const t = (x - a.x) / (b.x - a.x);
    const out = { x, y: a.y + (b.y - a.y) * t, nearIndex };
    for (const key of [&#x27;cv&#x27;, &#x27;current&#x27;, &#x27;previous&#x27;]) {
      if (a[key] !== undefined) out[key] = a[key] + (b[key] - a[key]) * t;
    }
    return out;
  }

  function draw(host) {
    const mode = host.dataset.mode;
    const kind = host.dataset.kind;
    const series = seriesFor(mode, kind);
    host.replaceChildren();
    const width = Math.max(320, Math.floor(host.getBoundingClientRect().width));
    const height = kind === &#x27;throughput&#x27; ? 300 : 270;
    const margin = { top: 10, right: 14, bottom: 48, left: width &lt; 430 ? 64 : 72 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const svg = d3.select(host).append(&#x27;svg&#x27;)
      .attr(&#x27;class&#x27;, &#x27;queue-chart&#x27;)
      .attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`)
      .attr(&#x27;role&#x27;, &#x27;img&#x27;)
      .attr(&#x27;aria-label&#x27;, kind === &#x27;throughput&#x27; ? `${mode} 当前吞吐量折线图` : `${mode} Hakle 相对上轮变化折线图`);
    svg.append(&#x27;title&#x27;).text(kind === &#x27;throughput&#x27; ? &#x27;当前吞吐量&#x27; : &#x27;相对上轮变化&#x27;);
    svg.append(&#x27;desc&#x27;).text(kind === &#x27;throughput&#x27; ? &#x27;Hakle 与 moodycamel 三种调用路径的七次重复中位数。&#x27; : &#x27;Hakle 当前七次重复中位数相对上一轮单次结果的百分比变化。&#x27;);
    const g = svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},${margin.top})`);
    const x = d3.scaleLinear().domain(d3.extent(threads)).range([6, innerWidth - 6]);
    const allValues = series.flatMap(s =&gt; s.values.flatMap(v =&gt; kind === &#x27;throughput&#x27; ? [v.lo, v.hi] : [v.y]));
    let y;
    if (kind === &#x27;throughput&#x27;) {
      const extent = allValues.length ? d3.extent(allValues) : [10, 1000];
      const ratioPad = Math.pow(extent[1] / extent[0], 0.08);
      y = d3.scaleLog().domain([extent[0] / ratioPad, extent[1] * ratioPad]).range([innerHeight - 6, 6]);
    } else {
      const extent = allValues.length ? d3.extent([...allValues, 0]) : [-10, 10];
      const span = Math.max(10, extent[1] - extent[0]);
      y = d3.scaleLinear().domain([extent[0] - span * 0.10, extent[1] + span * 0.10]).nice().range([innerHeight - 6, 6]);
    }
    const tickValues = width &lt; 430 ? [1, 8, 16, 24] : threads;
    const xAxis = d3.axisBottom(x).tickValues(tickValues).tickFormat(d3.format(&#x27;d&#x27;));
    const yAxis = kind === &#x27;throughput&#x27;
      ? d3.axisLeft(y).ticks(5, &#x27;~s&#x27;)
      : d3.axisLeft(y).ticks(5).tickFormat(v =&gt; `${v &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${v}%`);
    const grid = kind === &#x27;throughput&#x27;
      ? d3.axisLeft(y).ticks(5).tickSize(-innerWidth).tickFormat(&#x27;&#x27;)
      : d3.axisLeft(y).ticks(5).tickSize(-innerWidth).tickFormat(&#x27;&#x27;);

    svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;y&#x27;)

    const markers = markerLayer.selectAll(&#x27;path&#x27;).data(series).join(&#x27;path&#x27;)

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    }

  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();

      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),

          padding: tooltipGap,

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

          return;

        floating.style.visibility = &quot;visible&quot;;

      .catch(() =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =
